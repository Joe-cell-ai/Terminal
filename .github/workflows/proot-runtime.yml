name: Build ARM64 PRoot runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/proot-runtime.yml"
      - "tools/proot/**"

permissions:
  contents: read

jobs:
  build-proot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4

      - name: Checkout official Termux package recipes
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: 8d52c3057bb01e89a1fb4ed0592b7602dce38731
          path: termux-packages

      - name: Build official ARM64 PRoot package and dependencies
        working-directory: termux-packages
        env:
          TERMUX_ARCH: aarch64
          CI: "true"
        run: |
          set -euo pipefail
          ./scripts/run-docker.sh ./build-package.sh -a aarch64 proot

      - name: Assemble runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/proot-runtime/root
          shopt -s nullglob
          debs=(termux-packages/output/*.deb)
          if (( ${#debs[@]} == 0 )); then
            echo "Termux build produced no Debian packages" >&2
            exit 1
          fi
          for deb in "${debs[@]}"; do
            dpkg-deb -x "$deb" dist/proot-runtime/root
          done
          find dist/proot-runtime/root -type f -name proot -print -quit | grep -q .
          mkdir -p dist/proot-runtime/lib dist/proot-runtime/libexec
          if [[ -d dist/proot-runtime/root/data/data/com.termux/files/usr/lib ]]; then
            cp -a dist/proot-runtime/root/data/data/com.termux/files/usr/lib/. dist/proot-runtime/lib/
          fi
          if [[ -d dist/proot-runtime/root/data/data/com.termux/files/usr/libexec ]]; then
            cp -a dist/proot-runtime/root/data/data/com.termux/files/usr/libexec/. dist/proot-runtime/libexec/
          fi
          PROOT_BIN="$(find dist/proot-runtime/root -type f -path '*/bin/proot' -print -quit)"
          LOADER="$(find dist/proot-runtime -type f -path '*/libexec/proot/loader' -print -quit)"
          test -n "$PROOT_BIN"
          test -n "$LOADER"
          test -s dist/proot-runtime/lib/libtalloc.so
          test -s dist/proot-runtime/lib/libandroid-shmem.so
          install -m 755 "$PROOT_BIN" dist/proot-runtime/proot
          file dist/proot-runtime/proot | grep -E 'ARM aarch64|ARM64'
          rm -rf dist/proot-runtime/root
          {
            printf '%s\n' "Source: https://github.com/termux/termux-packages"
            printf '%s\n' "Source commit: 8d52c3057bb01e89a1fb4ed0592b7602dce38731"
            printf '%s\n' "Recipe: packages/proot/build.sh"
            printf '%s\n' "License: GPL-2.0 (PRoot); dependencies retain their upstream licenses."
          } > dist/proot-runtime/BUILD-INFO.txt
          sha256sum dist/proot-runtime/proot > dist/proot-runtime/SHA256SUMS
          tar -C dist -czf dist/proot-runtime-aarch64.tar.gz proot-runtime
          sha256sum dist/proot-runtime-aarch64.tar.gz > dist/proot-runtime-aarch64.tar.gz.sha256
          tar -tzf dist/proot-runtime-aarch64.tar.gz

      - name: Publish versioned runtime release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view proot-runtime >/dev/null 2>&1; then
            gh release create proot-runtime --title "PRoot ARM64 runtime" --notes "Separately downloadable ARM64 PRoot runtime for Terminal. Built from the pinned official Termux package recipe."
          fi
          gh release upload proot-runtime dist/proot-runtime-aarch64.tar.gz dist/proot-runtime-aarch64.tar.gz.sha256 --clobber

      - name: Upload ARM64 PRoot runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: proot-runtime-aarch64
          path: |
            dist/proot-runtime-aarch64.tar.gz
            dist/proot-runtime-aarch64.tar.gz.sha256
            dist/proot-runtime/SHA256SUMS
            dist/proot-runtime/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30
